# All paths must be absolute. Keep this file and the data directory owner-only.
data_dir = "/var/lib/sovereign-node"
# Increment this monotonic value for every capability, target, root, or action mapping change.
policy_version = 1

[storage]
# These fail-closed limits cannot be disabled. Remote admission stops at soft pressure while
# owner-local status/archive/verification remain available from the maintenance reserve.
database_soft_bytes = 268435456
database_hard_bytes = 536870912
wal_hard_bytes = 67108864
minimum_free_bytes = 536870912
maintenance_reserve_bytes = 67108864
max_total_replays = 65536
max_active_audit_events = 131072
# Terminal replay detail is eligible only this many seconds after signed expiry.
replay_retention_secs = 3900
archive_max_events = 10000

# The remote listener is intentionally absent by default. To enable it, set an exact loopback or
# private-LAN SocketAddr and provide TLS files. Wildcard/public addresses and plaintext are rejected.
# listen = "192.168.1.50:7443"
#
# [tls]
# certificate_pem = "/etc/sovereign-node/node-cert.pem"
# private_key_pem = "/etc/sovereign-node/node-key.pem"

# Optional offline-update staging. Adding or changing these pinned keys is a policy change and
# requires a higher policy_version. The release and owner-approval keys must be different Ed25519
# public keys. Staging verifies local bytes but never installs or executes them.
# [updates]
# release_public_key_hex = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
# owner_approval_public_key_hex = "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"
# max_artifact_bytes = 1073741824

[policy]
# With the matching signed adapters below, the owner may also add `GpuStatus`, `EngineStatus`,
# `ModelStatus`, `ProcessStatus`, `ServiceStatus`, `RepositoryStatus`, `AgentGreenHealth`, or
# `ActionBrokerHealth`. Every addition is a policy change.
enabled_capabilities = ["SystemInfo", "ResourceStatus"]
max_frame_bytes = 1048576
max_concurrent_actions = 4
queue_capacity = 32
# Durable per-paired-peer admission limit; reconnecting does not reset the window.
max_requests_per_peer_per_minute = 120
# Durable aggregate limit across every paired peer and connection.
max_requests_global_per_minute = 1000
max_action_ttl_secs = 300
max_clock_rollback_secs = 5
require_owner_signature_for_all_actions = true
max_file_read_bytes = 524288
max_file_write_bytes = 524288
max_action_output_bytes = 262144
max_action_runtime_secs = 30

[process_reporting]
# Optional and disabled by default. Enabling ProcessStatus requires this signed, fresh logical
# snapshot and a higher policy_version. The payload cannot contain PIDs, commands, paths, users,
# environments, or process-control instructions.
# [process_reporting.snapshot]
# snapshot_path = "/run/sovereign-processes/status.json"
# public_key_hex = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
# max_age_secs = 30

[repository_reporting]
# Optional and disabled by default. Enabling RepositoryStatus requires this signed, fresh logical
# snapshot and a higher policy_version. The node does not open a repository or invoke Git, and the
# payload cannot contain paths, remotes, credentials, diffs, file contents, hooks, or commands.
# [repository_reporting.snapshot]
# snapshot_path = "/run/sovereign-repositories/status.json"
# public_key_hex = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
# max_age_secs = 30

[service_reporting]
# Optional and disabled by default. Enabling ServiceStatus requires this signed, fresh logical
# snapshot and a higher policy_version. The payload cannot contain service-manager paths,
# commands, environments, credentials, PIDs, logs, configuration, or control instructions.
# [service_reporting.snapshot]
# snapshot_path = "/run/sovereign-services/status.json"
# public_key_hex = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
# max_age_secs = 30

# Optional Unix-only FileRead publication. The root must be a dedicated owner-controlled
# directory, must not overlap node/snapshot/TLS/action state, and every readable file must be
# listed exactly. Hidden, credential-like, executable, linked, or special files are denied.
# Enabling FileRead and adding/changing any entry requires a higher policy_version.
# [read_roots.reports]
# path = "/srv/sovereign-node-public/reports"
# allowed_files = ["daily/status.txt", "summary.json"]

# Reserved future writable-root shape. v0.1 rejects advertising and executing FileWrite.
# The legacy root must not contain or be contained by data_dir.
# [file_roots]
# future-writes = "/srv/sovereign-node/future-writes"

# Reserved future policy shape. v0.1 rejects advertising ExecuteApprovedAction.
# The eventual caller supplies only a catalog ID; no shell text or uploaded program is accepted.
# [approved_actions.service_snapshot]
# executable = "/usr/local/libexec/sovereign-service-snapshot"
# fixed_arguments = ["--format", "json"]
# working_directory = "/var/empty"
# executable_sha256 = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
# timeout_secs = 10

[health]
# Both adapters are optional and disabled by default. They only read a bounded, signed, sanitized
# local snapshot; they never contact, configure, or control either component. Missing, stale,
# malformed, symlinked, or incorrectly signed snapshots report Unknown.
#
# [health.agent_green]
# snapshot_path = "/run/agentgreen/sovereign-node-health.json"
# public_key_hex = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
# max_age_secs = 60
#
# [health.action_broker]
# snapshot_path = "/run/sovereign-action-broker/health.json"
# public_key_hex = "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"
# max_age_secs = 30

[resource_reporting]
# Optional signed accelerator/model measurements. The producer key and path must be distinct from
# both health adapters and every update authority. Missing or unverifiable data remains Unknown.
# [resource_reporting.snapshot]
# snapshot_path = "/run/sovereign-resources/snapshot.json"
# public_key_hex = "123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0"
# max_age_secs = 30
