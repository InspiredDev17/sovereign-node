[package]
name = "sovereign-node"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A fail-closed local capability daemon for owner-authorized actions"
license = "Apache-2.0"
repository = "https://github.com/InspiredDev17/sovereign-node"

[dependencies]
anyhow = "1.0.104"
cap-std = "3.4.5"
clap = { version = "4.6.6", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "zeroize"] }
hex = "0.4.3"
postcard = { version = "1.1.3", default-features = false, features = ["alloc", "use-std"] }
rand = "0.8.5"
rusqlite = { version = "0.37.0", features = ["bundled"] }
rustix = { version = "1.1.3", features = ["fs", "process"] }
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sysinfo = "0.37.2"
thiserror = "2.0.18"
time = { version = "0.3.45", features = ["formatting", "serde"] }
tokio = { version = "1.49.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
toml = "0.9.11"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
zeroize = "1.8.2"

[dev-dependencies]
proptest = "1.9.0"
rcgen = "0.14.9"
tempfile = "3.24.0"

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
